  <rect x="0" y="2" width="3" height="32" rx="0.1" fill="#334155"/>
  <rect x="30" y="2" width="3" height="32" rx="0.1" fill="#334155"/>

  <rect x="3" y="2"  width="27" height="32" rx="0.1" fill="#475569"/>
  <rect x="3" y="5"  width="27" height="2" rx="0.1" fill="#64748b"/>
