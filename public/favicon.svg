  <rect x="11" y="27" width="10" height="2" rx="0.5" fill="#94a3b8"/>

  <!-- Monogram "G" as path (stroke-based open-end arc + horizontal bar) -->
  <!-- Arc center ≈ (15.5, 16), radius 9.5 -->
  <!-- Opening at upper-right, bar extends leftward at mid-height -->
  <path
    d="M 22,9 A 9.5,9.5 0 1 0 25,16 L 15,16"
    fill="none"
    stroke="#f1f5f9"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.85"
  />
